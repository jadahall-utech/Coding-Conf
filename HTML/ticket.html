<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket | Coding Conf 2026</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="brand">
            <img src="../assets/logo.png" alt="Coding Conf Logo" class="logo">
            <span>Coding Conf</span>
        </div>
        <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        </nav>
    </header>
    <main> 
        <section class="congrats">
            <h1>Congrats, <span id="ticket-name"></span>! <br>Your ticket is ready.</h1>
            <p>Registered with: <span id="ticket-email"></span></p>
        </section>
        <section class="ticket">
            <div class="ticket-header">
                <img class="ticket-logo" src="../assets/logo.png" alt="Coding Conf Logo">
                <h2>Coding Conf 2026</h2>
                <p>October 26, 2026 · Papine, Kgn</p>
            </div>
            <div class="ticket-body">
                <img id="ticket-avatar" alt="Your avatar">

                <div class="ticket-details">
                    <p id="ticket-fullname"></p> 
                    <a id="ticket-github" href="#"></a> 
                    <p id="ticket-serial"></p>
                </div>
            </div>
        </section>

    </main>
    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>   
<script src="../js/ticket.js"></script>
</body>
</html>
