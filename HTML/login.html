<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Coding Conf 2026</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <div class="brand">
            <img src="../assets/logo.png" alt="Coding Conf Logo" class="logo">
            <span>Coding Conf</span>
        </div>
        <nav>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        </nav>
    </header>
    <main>
        <section class="register"> 
            <h1>Register for Coding Conf 2026</h1>
            <form id="registration-form">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">
                    <span class="error" id="fullname-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                    <span class="error" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="github">GitHub Handle:</label>
                    <input type="text" id="github" name="github" placeholder="@johndoe-utech">
                    <span class="error" id="github-error"></span>
                </div>

                <div class="form-group">
                    <label for="avatar">Avatar:</label>
                    <input type="file" id="avatar" name="avatar" accept="image/jpeg, image/png">
                    <span class="error" id="avatar-error"></span>
                </div>

                <button type="submit">Generate my ticket</button>
                 
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>   
<script src="../js/validation.js"></script>
</body>
</html>
